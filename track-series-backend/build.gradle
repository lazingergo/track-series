plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'track-series-backend'

apply from: "$rootDir/lint.gradle"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Compiler Configuration for Maximum Warning Detection
tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:all,-processing,-path'
    options.deprecation = true
    options.encoding = 'UTF-8'
}

// Override test compilation to suppress specific warnings
tasks.named('compileTestJava') {
    options.compilerArgs.remove('-Xlint:all,-processing,-path')
    options.compilerArgs << '-Xlint:none'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JPA + Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('unitTest', Test) {
    description = 'Runs backend unit tests.'
    group = 'verification'
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
