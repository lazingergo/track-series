spring.datasource.url=jdbc:h2:mem:trackseries;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Dummy secrets for testing
application.security.jwt.secret-key=dummy_test_secret_must_be_long_enough_for_hmac_sha256_algorithm_1234567890
application.security.jwt.expiration=86400000

# Dummy CORS origin to prevent PlaceholderResolutionException
app.cors.allowed-origins=http://localhost:5173
