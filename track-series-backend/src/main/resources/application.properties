spring.application.name=track-series-backend

spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# DB
spring.datasource.url=jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.name:track_series}?serverTimezone=UTC
spring.datasource.username=${db.username:root}
spring.datasource.password=${db.password}

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# api
tvmaze.api.base-url=https://api.tvmaze.com