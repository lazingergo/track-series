spring.application.name=track-series-backend
spring.profiles.default=develop

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# External APIs
tvmaze.api.base-url=https://api.tvmaze.com

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT
application.security.jwt.expiration=86400000
application.security.jwt.secret-key=${JWT_SECRET}


# Schedule
app.series-refresh.cron=0 0 4 * * 1
app.series-refresh.delay-ms=1000

