services:
  db:
    image: mysql:8.4
    container_name: trackseries-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-track_series}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./track-series-backend
      dockerfile: Dockerfile
    container_name: trackseries-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-track_series}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./track-series-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: trackseries-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  db-backup:
    image: mysql:8.4
    container_name: trackseries-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-track_series}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    command: >
      sh -c '
      mkdir -p /backups &&
      while true; do
        timestamp=$$(date +%Y%m%d-%H%M%S);
        mysqldump -h $$DB_HOST -P $$DB_PORT -u$$DB_USERNAME -p$$DB_PASSWORD $$DB_NAME > /backups/trackseries-$$timestamp.sql;
        find /backups -type f -name "trackseries-*.sql" -mtime +14 -delete;
        sleep $$BACKUP_INTERVAL_SECONDS;
      done
      '

volumes:
  db_data:
